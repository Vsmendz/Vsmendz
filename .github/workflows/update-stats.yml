name: Atualizar estatisticas do GitHub

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v6

      - name: Gerar estatisticas gerais
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Vsmendz&show_icons=true&hide_rank=true&include_all_commits=true&theme=tokyonight&locale=pt-br
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Gerar estatisticas de linguagens
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Vsmendz&layout=compact&langs_count=6&theme=tokyonight
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Salvar cards gerados
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- profile/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add profile/*.svg
            git commit -m "Atualiza estatisticas do perfil"
            git push
          fi
